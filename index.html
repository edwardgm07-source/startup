<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penalty Duel</title>
  </head>

  <body>
    <header>
      <h1>⚽ Penalty Duel</h1>

      <nav>
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="scores.html">Scores</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <hr />
    </header>

    <main>
      <h2>Welcome to Penalty Duel</h2>

      <p>
        Face another player in an exciting penalty shootout and prove who is
        the best from the penalty spot.
      </p>

      <img
        src="placeholder.png"
        alt="Penalty Duel placeholder"
        width="300"
      />

      <h3>Login or create an account</h3>

      <form method="get" action="play.html">
        <div>
          <label for="email">Email:</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="your@email.com"
            required
          />
        </div>

        <div>
          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="password"
            required
          />
        </div>

        <button type="submit">Login</button>
        <button type="submit">Create Account</button>
      </form>
    </main>

    <footer>
      <hr />
      <span>Created by Edward Gómez</span>
      <br />
      <a href="https://github.com/edwardgm07-source/startup">GitHub</a>
    </footer>
  </body>
</html>
